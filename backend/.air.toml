root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "migrations"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  kill_delay = "1s"
  log = "build-errors.log"
  poll = true
  poll_interval = 500
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false
