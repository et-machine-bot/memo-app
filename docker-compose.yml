name: memo-app

# Local development only: frontend, backend, and PostgreSQL.
# Production (S3+CloudFront, ECS Fargate+ALB, RDS) is out of scope.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-memo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - memo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - memo

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      # Compose DNS name. Host-side `go run` should use localhost instead.
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-memo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-memo_dev_password}
      DB_NAME: ${POSTGRES_DB:-memo}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - memo

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      # Browser-facing URL (published host port), not http://backend:8080.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - memo

networks:
  memo:

volumes:
  memo_pg_data:
  frontend_node_modules:
